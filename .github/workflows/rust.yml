name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            libelf-dev \
            pkg-config

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        run: |
          cargo install cargo-binstall
          cargo binstall -y bpf-linker

      - name: Build eBPF
        run: |
          cargo +nightly build \
            -p ebpf-xdp \
            --target bpfel-unknown-none \
            -Z build-std=core,panic_abort \
            --release \
            --verbose

      - name: Build userspace
        run: cargo build --workspace --exclude ebpf-xdp --verbose

      - name: Run tests
        run: cargo test --workspace --exclude ebpf-xdp --verbose
